<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertapedia</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="tree.css">
<style>
/* Layout: 계통 경로 → 국명·학명 머리 → 사진 갤러리 → (설명 | 국명 카드·바깥 링크) */
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#1d2621; --muted:#5d6b63; --line:#d3dbd5;
  --moss:#2f5d46; --moss-soft:#dfeae3; --ok:#2e7d4f; --warn:#a86a12; --info:#3b5f8a;
  --ok-bg:#e1f1e7; --warn-bg:#f8ecd6; --info-bg:#e2eaf4; --shade:rgba(0,0,0,.62);
  --display:"Gowun Batang",Georgia,serif; --body:"Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa9a0; --line:#2f3a34;
  --moss:#8cc4a5; --moss-soft:#24352c; --ok:#7fcf9c; --warn:#e2b261; --info:#9bbbe3;
  --ok-bg:#1f3428; --warn-bg:#3a2e17; --info-bg:#1e2a3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --panel:#1c2420; --ink:#e4ebe6; --muted:#9aa9a0; --line:#2f3a34;
  --moss:#8cc4a5; --moss-soft:#24352c; --ok:#7fcf9c; --warn:#e2b261; --info:#9bbbe3;
  --ok-bg:#1f3428; --warn-bg:#3a2e17; --info-bg:#1e2a3a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);word-break:keep-all;overflow-wrap:break-word;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;margin:0}
a{color:var(--moss)}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding-inline:16px;padding-block:10px}
.top-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.logo{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);text-decoration:none}
.top nav{margin-left:auto;font-size:13.5px;display:flex;gap:14px}
.page{max-width:1320px;margin:0 auto;padding-inline:16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px}
.wrap{padding-block:16px 64px;min-width:0}
.navtree{position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;padding-block:12px 40px;font-size:13px}
/* 제목이 화면 밖으로 나가면 맨 위에 국명·학명 */
.stickbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.15);padding:7px 16px;cursor:pointer}
.stickbar-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px}
.stickbar b{font-family:var(--display);font-size:17px}
.stickbar i{font-size:13.5px;color:var(--muted)}
body.stuck .navtree{top:var(--barh,40px);max-height:calc(100vh - var(--barh,40px))}
.paneltog{font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.paneltog:hover{color:var(--ink);border-color:var(--moss)}
.paneltog .arr{display:inline-block;width:1em}
.navtree #tree{margin-top:8px}
.page.closed{grid-template-columns:minmax(0,1fr)}
.page.closed .navtree{position:static;max-height:none;padding-block:12px 0;border-top:0;order:0}
@media (max-width:980px){.page{grid-template-columns:minmax(0,1fr)}.navtree{position:static;max-height:60vh;order:2;border-top:1px solid var(--line)}}
.pn{display:flex;align-items:stretch;gap:8px;margin:0 0 14px;font-size:13px}
.pn a,.pn span.off{flex:1;min-width:0;display:flex;flex-direction:column;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-decoration:none}
.pn a:hover{border-color:var(--moss)}
.pn small{color:var(--muted);font-size:11px}
.pn .nx{text-align:right}
.pn b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn span.off{visibility:hidden}
.pn .pos{flex:none;align-self:center;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.prose h3{font-family:var(--display);font-size:19px;line-height:1.4;margin:1.7em 0 .5em}
.prose h4,.prose h5{font-size:16px;line-height:1.5;margin:1.4em 0 .4em}
.crumb{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px}
.crumb span+span::before{content:"›";margin-right:4px;opacity:.6}
h1{font-family:var(--display);font-size:clamp(30px,6vw,44px);line-height:1.15;margin:8px 0 2px;text-wrap:balance}
h1.en{font-family:var(--body);font-weight:600;font-size:clamp(24px,5vw,34px)}
.sci{font-family:var(--display);font-style:italic;font-size:19px;color:var(--muted)}
.sci b{font-style:normal;font-weight:400;font-size:13.5px;font-family:var(--body)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.chip{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--moss-soft);color:var(--moss);font-weight:500}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.info{background:var(--info-bg);color:var(--info)}
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;grid-auto-rows:150px;gap:8px}
.ph{position:relative;border-radius:6px;overflow:hidden;background:var(--moss-soft);margin:0;min-width:0}
.ph:first-child{grid-row:span 2}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph a{display:block;height:100%}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:14px 8px 5px;font-size:10.5px;line-height:1.35;background:linear-gradient(transparent,var(--shade));color:#fff}
/* 모바일: 대표사진은 자르지 않고 원래 비율로(전신이 보이게). 아주 긴 세로 사진만 화면 높이에 맞춘다 */
@media (max-width:640px){.gallery{grid-template-columns:1fr 1fr;grid-template-rows:auto;grid-auto-rows:120px}.ph:first-child{grid-column:span 2;grid-row:auto}.ph:first-child a{height:auto}.ph:first-child img{height:auto;max-height:75vh;object-fit:contain}}
.nophoto{padding:28px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted);font-size:13.5px}
.galnote{font-size:12px;color:var(--muted);margin:8px 0 0}
.prose{max-width:42em;font-size:16px;line-height:1.75}
@media (max-width:640px){.prose{line-height:1.7}}
.prose[data-lang=ko] .l-en,.prose[data-lang=en] .l-ko{display:none}
.langtog{display:inline-flex;vertical-align:middle;margin-left:10px;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-family:var(--body,inherit)}
.langtog button{font:inherit;font-size:12px;line-height:1.5;min-width:30px;padding:1px 8px;background:none;border:0;color:var(--muted);cursor:pointer}
.langtog button:hover{color:var(--ink)}.langtog button[aria-pressed=true]{background:var(--moss);color:var(--panel);font-weight:700}
.kn{font-size:10.5px;color:var(--moss);margin-left:2px;cursor:help;font-weight:700}
.konotes{margin:18px 0 12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;line-height:1.65}.konotes h3{font-size:14px;margin:0 0 6px}.konotes ol{margin:0;padding-left:20px}.konotes li{margin:0 0 5px}
.kt{font-size:11px;background:var(--warn-bg);border-radius:4px;padding:0 5px;white-space:nowrap}.kt.fix{background:color-mix(in srgb,var(--moss) 20%,transparent)}
.prose h2,.card h3{font-family:var(--display);font-size:21px;margin:0 0 8px}
.prose p{margin:0 0 1.05em;text-wrap:pretty}
.notice{font-size:12.5px;background:var(--warn-bg);padding:8px 12px;border-radius:6px;margin-bottom:14px}
.src{font-size:12px;color:var(--muted)}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.card h3{font-size:17px}
.big{font-family:var(--display);font-size:22px;font-weight:700}
.st{font-size:11.5px;padding:1px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.st.kos,.st.kshr,.st.official{background:var(--ok-bg);color:var(--ok)}
.st.consensus,.st.proposal{background:var(--info-bg);color:var(--info)}
.st.none,.st.split,.st.kos_held{background:var(--warn-bg);color:var(--warn)}
.why{font-size:13px;margin:10px 0 0}
.why b{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
dt{color:var(--muted)} dd{margin:0}
ul.links{list-style:none;margin:0;padding:0;font-size:14px}
ul.links li{padding:6px 0;border-bottom:1px dashed var(--line)}
ul.links li:last-child{border-bottom:0}
ul.links small{display:block;color:var(--muted);font-size:11.5px}
.ssp{font-size:13px;margin:0;padding-left:18px}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
button:focus-visible,a:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
.nm a{color:inherit;text-decoration:underline dotted;text-underline-offset:3px}.nm b{font-weight:600}
.hs{flex:1;max-width:320px;margin:0 12px}.hs input{width:100%;box-sizing:border-box;padding:7px 12px;border-radius:8px;border:1px solid var(--line,#3a4a40);background:transparent;color:inherit;font:inherit;font-size:14px}
@media (max-width:640px){.top-in{flex-wrap:wrap}.hs{order:3;flex-basis:100%;max-width:none;margin:8px 0 0}}
.memo{font-size:13px;color:var(--muted)}
.distmap{display:block;cursor:pointer;border-radius:8px;overflow:hidden;background:var(--sea)}
.distmap svg{display:block;width:100%;height:auto}
.distmap .land{fill:var(--land);stroke:var(--sea);stroke-width:.3}
.distmap .land.m{fill:var(--hab)}.distmap .land.i{fill:var(--intro)}.distmap .land.r{fill:var(--hab-soft)}
.distwrap{position:relative}
.distzoom{position:absolute;top:6px;right:6px;font:inherit;font-size:11px;line-height:1.4;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--sea);color:inherit;cursor:pointer}
.distzoom:hover{border-color:var(--moss)}
.distmap .hascells .land.m{fill:color-mix(in srgb,var(--hab) 30%,var(--land))}.distmap .hascells .land.i{fill:color-mix(in srgb,var(--intro) 30%,var(--land))}.distmap .hascells .land.r{fill:var(--land)}
.distmap .cell{opacity:.88}.distmap .cell.m{fill:var(--hab-dot)}.distmap .cell.i{fill:var(--intro)}.distmap .cell.r{fill:var(--rare-dot)}
.distnote{font-size:11px;color:var(--muted);margin:2px 0}
.distmap .sphere{fill:none;stroke:var(--line);stroke-width:.8}
.distmap:hover .sphere{stroke:var(--moss);stroke-width:1.5}
.card h3 .distnames{display:block;margin-top:3px;font-family:var(--body);font-size:12.5px;font-weight:400;line-height:1.55;color:var(--muted)}
.distnames .nm{white-space:nowrap}.distnames details{display:inline}.distnames summary{display:inline;cursor:pointer;color:var(--moss);margin-left:4px;list-style:none}.distnames summary::-webkit-details-marker{display:none}.distnames details[open] summary{display:none}.distnames .in{display:block}
.distleg{font-size:12px;color:var(--muted);margin:8px 0 2px;display:flex;align-items:center;gap:4px 12px;flex-wrap:wrap}
.distleg .lg{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.distleg .sw{display:inline-block;width:12px;height:12px;border-radius:3px}
.distleg .sw.m{background:var(--hab-dot)}.distleg .sw.i{background:var(--intro)}.distleg .sw.r{background:var(--rare-dot)}
:root{--sea:#dce6ea;--land:#b9c4bd;--hab:#e8a317;--hab-soft:#cfcca8;--intro:#2a9d8f;--hab-dot:#c2410c;--rare-dot:#6f7a72}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sea:#10171c;--land:#38443d;--hab:#ffc94d;--hab-soft:#4d5440;--intro:#4fd1c5;--hab-dot:#ffb020;--rare-dot:#8b978f}}
:root[data-theme="dark"]{--sea:#10171c;--land:#38443d;--hab:#ffc94d;--hab-soft:#4d5440;--intro:#4fd1c5;--hab-dot:#ffb020;--rare-dot:#8b978f}
.iucn{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;color:#fff;background:#6b7a72}
.iucn.i-LC{background:#3b8a5a}.iucn.i-NT{background:#7d9a2e}.iucn.i-VU{background:#c79a12;color:#1d1d1d}.iucn.i-EN{background:#d9701c}
.iucn.i-CR{background:#c8352b}.iucn.i-EW{background:#5e2a6e}.iucn.i-EX{background:#222}.iucn.i-DD{background:#8a8f8c}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;column-gap:28px;row-gap:14px;margin-top:28px;
  grid-template-areas:"prose name" "prose dist" "prose more";grid-template-rows:auto auto 1fr;align-items:start}
.cols>.prose{grid-area:prose}.cols>.namecard{grid-area:name}.cols>.distbox{grid-area:dist}.cols>.more{grid-area:more}
.distbox,.more{display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr);grid-template-areas:"dist" "prose" "name" "more";grid-template-rows:auto}}
@media (max-width:640px){.gallery .ph:nth-child(n+4){display:none}}
.distcard .obs{margin:8px 0 0;font-size:13.5px}.distcard .obs a{color:var(--moss)}
.distcard .range{margin:10px 0 0;font-size:13px;line-height:1.55}
.distcard .range span:first-child{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
.iucncard{display:block;padding:14px 16px}
.card .iucnh{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600;font-family:inherit}
.iucnh span{text-transform:uppercase;font-weight:500;margin-left:4px;opacity:.8}
.iucnscale{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.iucnscale .lv{font-size:11px;font-weight:700;text-align:center;padding:7px 0;border-radius:5px;color:rgba(40,40,40,.45);opacity:.55}
.iucnscale .lv.on{opacity:1;color:#fff;transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.25);outline:2px solid rgba(0,0,0,.08)}
.lv-LC{background:#5b7f2f}.lv-NT{background:#b5b85a}.lv-VU{background:#e0b452}.lv-EN{background:#d97f4a}
.lv-CR{background:#bf4a3f}.lv-EW{background:#6e5f57}.lv-EX{background:#3d3d3b}.lv-DD{background:#8a8f8c}.lv-NE{background:#b4b8b5}
.iucnscale .lv:not(.on){color:rgba(30,30,30,.55)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .iucnscale .lv:not(.on){color:rgba(255,255,255,.6)}}
:root[data-theme="dark"] .iucnscale .lv:not(.on){color:rgba(255,255,255,.6)}
.iucnname{margin:12px 0 2px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.iucnname .dot{width:11px;height:11px;border-radius:50%;display:inline-block;align-self:center}
.iucnname b{font-size:15px}.iucnname i{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:16px}
.iucnoff{font-size:12px;color:var(--muted);margin:8px 0 0}
.iucnsrc{color:var(--muted);font-size:11.5px}
</style>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="./">Vertapedia</a>
  <form class="hs" action="find.html" role="search"><input name="q" type="search" placeholder="이름 찾기 (국명·학명·초성)" aria-label="이름 찾기"></form>
  <nav><a href="./" title="무작위 종 문서">무작위 종</a><a href="find.html">분류군</a><a href="review.html">국명 기준</a></nav>
</div></header>
<div class="stickbar" id="stickbar" hidden title="맨 위로"><div class="stickbar-in"></div></div>
<div class="page">
  <aside class="navtree" aria-label="분류군"><button type="button" class="paneltog" id="paneltog" aria-expanded="false" aria-controls="tree"><span class="arr">▸</span> 분류군</button><div id="tree" hidden></div></aside>
  <main class="wrap" id="main"><p class="empty">불러오는 중입니다.</p></main>
</div>
<script src="tree.js"></script>
<script src="suggest.js"></script>
<script>
const META=/*META*/null;
const esc=t=>String(t==null?'':t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
// 본문 속 생물 이름: [국명, 원래 이름, 계급(s 종·S 학명·g 속·f 과·o 목), 학명, 처음?].
// 국명은 문장 속 낱말로 둬야 번역기가 명사로 보고 조사를 붙인다. 괄호 속 원래 이름과 학명만 translate="no"
const NM_PAGE={s:'sp',S:'sp',f:'fam'};
const pageUrl=(page,sci)=>{const s=encodeURIComponent(sci.replace(/ /g,'_'));return page==='sp'?`sp/${s}.html`:`${page}.html#${s}`};
function nmHtml(x,self){
  const [ko,orig,rk,sci,first]=x, page=NM_PAGE[rk], go=page&&sci!==self?pageUrl(page,sci):null;
  const it=rk==='S'||rk==='g', o=it?`<i>${esc(orig)}</i>`:esc(orig);
  if(rk==='S')return `<span class="nm notranslate" translate="no" title="${esc(ko)}">${go?`<a href="${go}">${o}</a>`:o}</span>`;
  const k=go?`<a href="${go}">${esc(ko)}</a>`:`<b>${esc(ko)}</b>`;
  return `<span class="nm" title="${esc(orig)}">${k}${first?`<span class="notranslate" translate="no"> (<span lang="en">${o}</span>)</span>`:''}</span>`;
}
const para=(p,self)=>typeof p==='string'?esc(p):p.map(x=>typeof x==='string'?esc(x):nmHtml(x,self)).join('');
// 설명 언어: 번역(ko)·원문(en). 고른 값은 화면 모드처럼 이 브라우저에 기억한다.
let DESC_LANG='ko';
try{if(localStorage.getItem('vp-desc-lang')==='en')DESC_LANG='en'}catch(e){}
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.langtog button');
  if(!b)return;
  DESC_LANG=b.dataset.l;
  try{localStorage.setItem('vp-desc-lang',DESC_LANG)}catch(err){}
  const sec=b.closest('.prose');
  sec.dataset.lang=DESC_LANG;
  sec.querySelectorAll('.langtog button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
const koText=s=>esc(s).replace(/\*([^*]+)\*/g,'<i>$1</i>');
const paraKo=(p,self)=>typeof p==='string'?koText(p):p.map(x=>typeof x==='string'?koText(x):nmHtml(x,self)).join('');
// 원문 보기: 끼워 넣은 국명 없이 위키백과 문장 그대로. 이름 링크만 남긴다.
function paraEn(p,self){
  if(typeof p==='string')return esc(p);
  return p.map(x=>{
    if(typeof x==='string')return esc(x);
    const page=NM_PAGE[x[2]],go=page&&x[3]!==self?pageUrl(page,x[3]):null;
    return esc(x[5]||'')+(go?`<a href="${go}" title="${esc(x[0])}">${esc(x[1])}</a>`:esc(x[1]));
  }).join('');
}
function descKo(d){
  const w=d.wiki,k=d.wiki_ko,src=`<a href="${esc(w.url)}" target="_blank" rel="noopener">Wikipedia, “${esc(w.title)}”</a>`;

function mvtPoints(buf,tx){

function cellPaths(cells,proj){

  return `<div class="card iucncard"><h3 class="iucnh">보전 현황 <span>Conservation status</span></h3>
    <div class="iucnscale" role="img" aria-label="IUCN 적색목록 ${esc(d.iucn)} ${IUCN[c]}">${scale.map(k=>`<span class="lv lv-${k}${k===c?' on':''}" title="${k} · ${IUCN[k]}">${k}</span>`).join('')}</div>
    ${scale.includes(c)?'':`<p class="iucnoff">${esc(c)} — 등급 칸 밖(평가 자료 부족)</p>`}
    <p class="iucnname"><span class="dot lv-${c}"></span><b>${IUCN[c]}</b> <i>${IUCN_EN[c]}</i>${peTxt}</p>
    <small class="iucnsrc">IUCN Red List · ${d.group==='AVES'?'BirdLife (AviList v2026)':'GBIF'}</small></div>`;
}
// 분포: 지도(누르면 iNaturalist 관찰 지도) + 관찰 수 + 조류는 AviList 분포 설명
function distNames(g){
  if(!g||!(g.mk||[]).length&&!(g.ik||[]).length)return '';
  const list=a=>a.map(n=>`<span class="nm">${esc(n)}</span>`).join(', ');
  const m=g.mk||[],i=g.ik||[],FEW=15;  // 많으면 기록 많은 곳만 먼저 보이고 나머지는 접어 둔다
  const shown=m.length>FEW+3?`${list(m.slice(0,FEW))}<details class="more"><summary>외 ${m.length-FEW}곳</summary>${list(m.slice(FEW))}</details>`:list(m);
  return `<small class="distnames">${shown}${i.length?`<span class="in">이입: ${list(i)}</span>`:''}</small>`;
}
function distCard(d){
  if(!d.dist&&!d.range&&!(d.inat&&d.inat.observations))return '';
  const to=d.inat?`https://www.inaturalist.org/observations?taxon_id=${d.inat.id}&subview=map`:d.dist&&d.dist.key?`https://www.gbif.org/species/${d.dist.key}`:d.dist?`https://www.gbif.org/occurrence/search?verbatim_scientific_name=${encodeURIComponent(d.dist.verbatim[0])}`:'';
  return `<div class="card distcard"><h3>분포${distNames(d.dist)}</h3>
    ${d.dist?`<div class="distwrap"><a class="distmap" id="distmap" href="${to}" target="_blank" rel="noopener" aria-label="분포 지도. 누르면 ${d.inat?'iNaturalist':'GBIF'} 관찰 지도로 갑니다"></a><button type="button" class="distzoom" id="distzoom" hidden></button></div>
    <p class="distleg"><span class="lg"><span class="sw m"></span>서식국가 ${d.dist.mn.toLocaleString()}건</span>${d.dist.inn?`<span class="lg"><span class="sw i"></span>이입국가 ${d.dist.inn.toLocaleString()}건</span>`:''}${d.dist.rn?`<span class="lg"><span class="sw r"></span>소수기록 ${d.dist.rn.toLocaleString()}건</span>`:''}</p>
    <p class="distnote" id="distnote" hidden>진한 칸은 GBIF 기록이 있는 곳(약 40km 단위), 옅은 바탕은 그 기록이 속한 나라·지역입니다.</p>`:''}
    ${d.inat&&d.inat.observations?`<p class="obs"><a href="${to}" target="_blank" rel="noopener">iNaturalist 관찰 <b>${d.inat.observations.toLocaleString()}</b>건 ↗</a></p>`:''}
    ${d.range?`<p class="range"><span>AviList 분포 설명</span><span lang="en">${esc(d.range)}</span></p>`:''}
    ${d.dist?`<p class="src">GBIF 기록 ${d.dist.n.toLocaleString()}건${d.dist.verbatim?` · GBIF 분류 체계에 없는 학명이라 원자료에 적힌 학명으로 찾았습니다(${d.dist.verbatim.map(n=>`<i>${esc(n)}</i>`).join(', ')})`:''}</p>`:''}
  </div>`;
}
function render(d){
  CUR=d;drawTree();
  document.title=`${d.name||d.en||d.sci} · Vertapedia`;
  const title=d.name?`<h1>${esc(d.name)}</h1>`:`<h1 class="en">${esc(d.en||d.sci)}</h1>`;
  const famLink=d.family&&d.family.name!==undefined?`<a href="fam.html#${encodeURIComponent(d.family.sci)}">${nm(d.family)}</a>`:d.family?nm(d.family):null;
  const crumb=[d.group==='AVES'?'조류':'파충류',d.order?nm(d.order):null,d.suborder&&d.suborder.sci?nm(d.suborder):null,d.superfamily&&d.superfamily.sci?nm(d.superfamily):null,famLink,d.subfamily&&d.subfamily.sci?nm(d.subfamily):null,d.genus?(d.genus.type&&d.genus.type!==d.sci?`<a href="${link({sci:d.genus.type})}" title="모식종: ${esc(d.genus.type)}">${nm(d.genus)}</a>`:nm(d.genus)):null].filter(Boolean);
  const chips=[];
  if(d.name&&d.en)chips.push(`<span class="chip">${esc(d.en)}</span>`);
  if(d.kos&&d.kos.category)chips.push(`<span class="chip">${esc(KOS[d.kos.category]||d.kos.category)}</span>`);
  if(d.kr)chips.push(`<span class="chip" title="한국양서파충류학회 2025 수록">${esc(d.kr)}</span>`);
  if(d.type_species)chips.push(`<span class="chip" title="${esc(d.genus&&(d.genus.name||d.genus.sci))}의 모식종">모식종</span>`);
  const ph=d.photos||[];
  const gal=ph.length?`<div class="gallery">${ph.map((p,i)=>`<figure class="ph"><a href="https://www.inaturalist.org/${p.obs?`observations/${p.obs}`:`photos/${p.photo}`}" target="_blank" rel="noopener"><img src="${esc(p.url.replace('{size}',i===0?'large':'medium'))}" alt="${esc(d.name||d.sci)} 사진 ${i+1}" loading="${i<3?'eager':'lazy'}"></a><figcaption>${esc(credit(p))}${i===0&&p.place?' · '+esc(p.place):''}</figcaption></figure>`).join('')}</div>
    <p class="galnote">사진: iNaturalist에서 재사용이 허락된 사진(${[...new Set(ph.map(p=>LIC[p.license]||p.license))].join(', ')}). ${ph[0].cover?'첫 사진은 iNaturalist 큐레이터가 고른 이 종의 대표 사진입니다. ':''}사진을 누르면 원래 기록으로 갑니다.</p>`
    :`<div class="nophoto">${d.fetched?'재사용이 허락된 iNaturalist 사진이 아직 없습니다.':'사진을 아직 받지 않은 종입니다. 한국 출현종부터 차례로 받고 있습니다.'}</div>`;
  const w=d.wiki;
  const body=w&&w.sections?w.sections.map(s=>(s.h?`<h${Math.min(s.level+1,5)} lang="en">${esc(s.h)}</h${Math.min(s.level+1,5)}>`:'')+s.paras.map(p=>`<p lang="en">${para(p,d.sci)}</p>`).join('')).join('')
    :w&&w.extract?`<p lang="en">${esc(w.extract)}</p>`:'';
  const desc=d.wiki_ko&&w&&w.sections?descKo(d):body?`${w.genus_doc?`<div class="notice">이 종의 영문 위키백과 문서가 없어 <b>속(<i>${esc(w.title)}</i>) 문서</b>를 대신 싣습니다. 이 종만의 설명은 아닙니다.</div>`:''}<div class="notice">${w.sections?'영문 위키백과 본문을 그대로 싣습니다(참고문헌·바깥 링크 절 제외).'+(w.ko_linked?' 생물 이름은 버타피디아 국명으로 바꿨고, 처음 나올 때 원래 이름을 괄호에 함께 적었습니다. 이름을 누르면 해당 문서로 갑니다.':''):'영문 위키백과 요약입니다. 본문 전체는 곧 받아 옵니다.'} 한국어 번역은 준비 중입니다.</div>${body}<p class="src">출처: <a href="${esc(w.url)}" target="_blank" rel="noopener">Wikipedia, “${esc(w.title)}”</a>${w.revision?` (판 ${w.revision})`:''} · <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ko" target="_blank" rel="noopener">CC BY-SA 4.0</a></p>`
    :`<p class="src">이 종의 위키백과 설명을 아직 찾지 못했습니다.</p>`;
  const why=d.rationale?`<p class="why"><b>명칭 근거</b>${esc(d.rationale)}</p>`:'';
  const refs=[];
  if(d.refs.moe)refs.push(['환경부 지정명',d.refs.moe]);
  if(d.refs.trade&&d.refs.trade!=='-')refs.push(['국내 유통명',d.refs.trade]);
  if(d.synonyms&&d.synonyms.length)refs.push(['이명',d.synonyms.map(s=>`<i>${esc(s)}</i>`).join(', ')]);
  if(d.review)refs.push(['명칭 메모',`<span class="memo">${memo(d.review)}</span>`]);
  const ssp=d.subspecies&&d.subspecies.length?`<div class="card"><h3>아종</h3><ul class="ssp">${d.subspecies.map(s=>`<li><i>${esc(s.sci)}</i>${s.author?` <span class="src">${esc(s.author)}</span>`:''} ${esc(s.ko)}${s.note?` <span class="src">(${esc(s.note.split(' · ')[0])})</span>`:''}</li>`).join('')}</ul></div>`:'';
  const [g,e]=d.sci.split(' ');
  const links=[];
  if(d.ebird){links.push(`<li><a href="https://ebird.org/species/${d.ebird}" target="_blank" rel="noopener">eBird 종 정보 ↗</a><small>분포 지도, 관찰 기록</small></li>`);
    links.push(`<li><a href="https://media.ebird.org/catalog?taxonCode=${d.ebird}&mediaType=photo" target="_blank" rel="noopener">Macaulay Library 사진 ↗</a><small>eBird 사진·소리 (저작권 보호, 원문에서 보기)</small></li>`);
    links.push(`<li><a href="https://birdsoftheworld.org/bow/species/${d.ebird}/cur/introduction" target="_blank" rel="noopener">Birds of the World ↗</a><small>코넬대 종 해설 (구독)</small></li>`);}
  if(d.group==='REPTILIA')links.push(`<li><a href="https://reptile-database.reptarium.cz/species?genus=${encodeURIComponent(g)}&species=${encodeURIComponent(e)}" target="_blank" rel="noopener">The Reptile Database ↗</a><small>분류, 분포, 문헌</small></li>`);
  if(d.inat)links.push(`<li><a href="https://www.inaturalist.org/taxa/${d.inat.id}" target="_blank" rel="noopener">iNaturalist ↗</a><small>관찰 기록, 사진</small></li>`);
  if(w)links.push(`<li><a href="${esc(w.url)}" target="_blank" rel="noopener">영문 위키백과 ↗</a></li>`);
  document.getElementById('main').innerHTML=`
    ${pn(d)}
    <div class="crumb">${crumb.map(c=>`<span>${c}</span>`).join('')}</div>
    ${title}
    <div class="sci"><i>${esc(d.sci)}</i>${d.author?` <b>${esc(d.author)}</b>`:''}</div>
    <div class="chips">${chips.join('')}</div>
    ${gal}
    <div class="cols">
      <section class="prose"${d.wiki_ko?` data-lang="${DESC_LANG}"`:''}><h2>설명${d.wiki_ko?langTog():''}</h2>${desc}</section>
      <div class="card namecard"><h3>국명</h3>
        <div class="big">${d.name?esc(d.name):'—'}</div>
        <span class="st ${d.status}">${ST[d.status]||d.status}</span>
        ${why}
        ${refs.length?`<dl>${refs.map(r=>`<dt>${r[0]}</dt><dd>${r[1].startsWith('<')?r[1]:esc(r[1])}</dd>`).join('')}</dl>`:''}
      </div>
      <div class="distbox">${iucnCard(d)}${distCard(d)}</div>
      <div class="more">${ssp}<div class="card"><h3>더 보기</h3><ul class="links">${links.join('')}</ul></div></div>
    </div>
    <div style="margin-top:28px">${pn(d)}</div>`;
  drawDist(d);
  stickTitle(d);
}
function load(){
  const sci=decodeURIComponent(location.pathname.split('/').pop().replace(/\.html$/,''));
  fetch(`sp/${encodeURIComponent(sci)}.json`).then(r=>{if(!r.ok)throw 0;return r.json()}).then(render)
    .catch(()=>{document.getElementById('main').innerHTML=`<p class="empty">“${esc(sci.replace(/_/g,' '))}” 종을 찾지 못했습니다. <a href="find.html">이름 찾기</a>로 돌아가기</p>`});
  scrollTo(0,0);
}
setPanel(OPEN);
// 종 사이를 오갈 때는 페이지를 새로 읽지 않고 주소만 바꾼다
const go=url=>{history.pushState(null,'',url);load()};
addEventListener('popstate',load);load();
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href]');
  if(!a||e.defaultPrevented||e.button||e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||a.target||a.origin!==location.origin||!/\/sp\/[^/]+\.html$/.test(a.pathname))return;
  e.preventDefault();go(a.href);
});
// ← → 로 시트 순서의 이전·다음 종
addEventListener('keydown',e=>{
  if(!CUR||e.altKey||e.ctrlKey||e.metaKey||/input|textarea|select/i.test(e.target.tagName))return;
  const x=e.key==='ArrowLeft'?CUR.prev:e.key==='ArrowRight'?CUR.next:null;
  if(x)go(link(x));
});
</script>
</body>
