<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의견 모아보기 · Vertapedia</title>
<meta name="description" content="버타피디아 문서마다 남겨진 의견, 오류 지적, 정보 추가를 한곳에서 봅니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<link rel="stylesheet" href="tree.css">
<link rel="stylesheet" href="sp.css">
<link rel="stylesheet" href="comments.css">
<style>
.talkpage{max-width:880px;margin:0 auto;padding:18px 16px 64px}
.talkpage h1{font-family:var(--display);font-size:26px;margin:0 0 4px}
.talkpage .vt{border-top:0;margin-top:0;padding-top:0}
</style>
<body>
<header class="top"><div class="top-in">
  <a class="logo" href="./">Vertapedia</a>
  <form class="hs" action="find.html" role="search"><input name="q" type="search" placeholder="이름 찾기 (국명·학명·초성)" aria-label="이름 찾기"></form>
  <nav><a href="./" title="무작위 종 문서">무작위 종</a><a href="find.html">분류군</a><a href="review.html">국명 기준</a><a href="talk.html">의견</a></nav>
</div></header>
<main class="talkpage">
  <h1>의견 모아보기</h1>
  <p class="vt-note">각 문서 맨 아래에 남겨진 의견입니다. 글을 누르면 그 문서의 의견창으로 갑니다. 의견은 해당 문서에서 남겨 주세요.</p>
  <div class="vt vt-feed" id="feed">
    <div class="vt-filters" id="kinds" aria-label="종류"></div>
    <div class="vt-filters" id="states" aria-label="처리 상태"></div>
    <div id="list"><p class="vt-empty">불러오는 중입니다.</p></div>
    <button type="button" class="vt-more" id="more" hidden>더 보기</button>
    <p class="vt-admin" id="adm"></p><div class="vt-gsi" id="gsi"></div>
  </div>
</main>
<script src="suggest.js"></script>
<script src="comments.js"></script>
<script>
(function(){
  const V=window.VTalk, esc=V.esc;
  const KINDS=[['','전체'],['error','오류 지적'],['info','정보 추가'],['opinion','의견']];
  const STATES=[['','모든 상태'],['todo','처리 전·검토 중'],['done','반영됨'],['wontfix','반영 안 함']];
  let kind='', status='', last=0;
  const href=c=>{const [t,s]=c.page.split(':');return (t==='sp'?`sp/${encodeURIComponent(s)}.html`:`fam.html#${encodeURIComponent(s)}`)+'#talk'};
  const famHref=c=>`fam.html#${encodeURIComponent(c.page.slice(4))}`;
  function row(c){
    const url=c.page.startsWith('fam:')?famHref(c):href(c);
    const who=c.admin?`<b class="vt-nick">${esc(c.nick)}</b><span class="vt-adm">관리자</span>`:`<b class="vt-nick">${esc(c.nick)}</b><span class="vt-ip">(${esc(c.ip)})</span>`;
    const tags=(c.kind&&c.kind!=='opinion'?`<span class="vt-tag k-${c.kind}">${V.KIND[c.kind]}</span>`:'')+(c.status?`<span class="vt-tag s-${c.status}">${V.STATUS[c.status]}</span>`:'');
    const body=c.body.length>240?c.body.slice(0,240)+'…':c.body;
    return `<a class="vt-thread" href="${url}"><div class="vt-meta"><span class="vt-doc">${esc(c.title||c.page.slice(c.page.indexOf(':')+1).replace(/_/g,' '))}</span>${who}<span class="vt-time">${V.when(c.created)}</span>${tags}${c.replies?`<span>답글 ${c.replies}</span>`:''}</div><div class="vt-body">${esc(body).replace(/\n/g,'<br>')}</div></a>`;
  }
  function chips(el,list,cur,set){
    el.innerHTML=list.map(([k,l])=>`<button type="button" data-k="${k}" aria-pressed="${k===cur}">${l}</button>`).join('');
    el.onclick=e=>{const b=e.target.closest('button');if(b){set(b.dataset.k);go(true)}};
  }
  function go(reset){
    chips(document.getElementById('kinds'),KINDS,kind,k=>kind=k);
    chips(document.getElementById('states'),STATES,status,k=>status=k);
    if(reset)last=0;
    const q=new URLSearchParams();if(kind)q.set('kind',kind);if(status)q.set('status',status);if(last)q.set('before',last);
    V.call('/recent?'+q).then(j=>{
      const list=document.getElementById('list'), items=j.items||[];
      const html=items.map(row).join('');
      if(reset)list.innerHTML=html||'<p class="vt-empty">해당하는 의견이 없습니다.</p>';else list.insertAdjacentHTML('beforeend',html);
      if(items.length)last=items[items.length-1].id;
      document.getElementById('more').hidden=items.length<30;
    }).catch(()=>{document.getElementById('list').innerHTML='<p class="vt-empty">의견을 불러오지 못했습니다.</p>'});
  }
  document.getElementById('more').onclick=()=>go(false);
  // 처리 전 오류 지적을 보기 쉽게: 주소에 ?todo 가 있으면 그 상태로 연다
  if(/[?&]todo\b/.test(location.search)){status='todo'}
  go(true);
})();
</script>
