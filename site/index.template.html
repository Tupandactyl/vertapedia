<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertapedia</title>
<style>
:root{--bg:#eef1ee;--ink:#1d2621;--muted:#5d6b63;--moss:#2f5d46;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--ink:#e4ebe6;--muted:#9aa9a0;--moss:#8cc4a5;color-scheme:dark}}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;padding-inline:16px;text-align:center}
a{color:var(--moss)} p{color:var(--muted)}
</style>
<body>
<main>
  <h1>Vertapedia</h1>
  <p id="msg">무작위 종 문서를 여는 중입니다.</p>
  <p><a href="find.html">이름 찾기 · 분류군</a></p>
</main>
<script>
// 처음 들어오면 국명과 사진이 있는 종 가운데 하나를 무작위로 연다.
fetch('data/random.json').then(r=>r.json()).then(pool=>{
  const sci=pool[Math.floor(Math.random()*pool.length)];
  location.replace('sp.html#'+encodeURIComponent(sci.replace(/ /g,'_')));
}).catch(()=>{location.replace('find.html')});
</script>
</body>
</html>
